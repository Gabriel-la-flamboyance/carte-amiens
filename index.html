<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Distribution Flyers – Amiens</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://cdn.tailwindcss.com"></script>

<style>
#map { height: 100vh; }
.leaflet-popup-content { font-size: 14px; }
</style>
</head>

<body class="bg-gray-50">

<div class="absolute top-4 left-4 z-[1000] bg-white p-3 rounded-lg shadow">
<input id="collaborateur" placeholder="Votre nom"
class="border px-3 py-2 rounded w-48"/>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

/* ================= FIREBASE ================= */
const app = initializeApp({
  apiKey: "AIzaSyAEUw4R8zeIcVJvoBvJLd6v_WueURjgKKo",
  databaseURL: "https://carte-amiens-default-rtdb.europe-west1.firebasedatabase.app"
});

const db = getDatabase(app);
const progRef = ref(db, "progression");

/* ================= MAP ================= */
const map = L.map("map", {
  tap: true,
  dragging: true,
  touchZoom: true,
  doubleClickZoom: false
}).setView([49.8941, 2.2958], 13);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map);

const layer = L.layerGroup().addTo(map);
let rues = [];
let progression = {};

/* ================= LOAD STREETS ================= */
async function loadRues() {
  const query = `
[out:json];
way["highway"]["name"](49.85,2.25,49.93,2.35);
out geom;
`;
  const res = await fetch("https://overpass-api.de/api/interpreter", {
    method: "POST",
    body: query
  });
  const json = await res.json();
  rues = json.elements.map(r => ({
    id: "rue_" + r.id,
    nom: r.tags.name,
    coords: r.geometry.map(p => [p.lat, p.lon])
  }));
  draw();
}

/* ================= DRAW ================= */
function draw() {
  layer.clearLayers();

  rues.forEach(rue => {
    const info = progression[rue.id];
    const visited = !!info;

    const poly = L.polyline(rue.coords, {
      color: visited ? "#22c55e" : "#ef4444",
      weight: visited ? 6 : 5,
      opacity: 0.8,
      interactive: true
    });

    poly.on("click", () => onRueClick(rue));
    poly.bindPopup(popupContent(rue));

    layer.addLayer(poly);
  });
}

/* ================= CLICK HANDLER ================= */
async function onRueClick(rue) {
  const name = document.getElementById("collaborateur").value.trim();
  if (!name) {
    alert("Entrez votre nom");
    return;
  }

  if (progression[rue.id]) {
    const ok = confirm(
      `Déjà visitée par ${progression[rue.id].collaborateur}\nRemplacer ?`
    );
    if (!ok) return;
  }

  await set(ref(db, "progression/" + rue.id), {
    collaborateur: name,
    date: new Date().toLocaleString("fr-FR"),
    nomRue: rue.nom
  });
}

/* ================= POPUP ================= */
function popupContent(rue) {
  const info = progression[rue.id];
  if (!info) {
    return `
<b>${rue.nom}</b><br>
❌ Non visitée<br>
<span class="text-xs text-gray-500">Tap / clic pour marquer</span>
`;
  }
  return `
<b>${rue.nom}</b><br>
✅ Visitée<br>
Par ${info.collaborateur}<br>
<small>${info.date}</small>
`;
}

/* ================= FIREBASE SYNC ================= */
onValue(progRef, snap => {
  progression = snap.val() || {};
  draw();
});

loadRues();
</script>

</body>
</html>
